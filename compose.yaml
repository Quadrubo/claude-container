services:
  claude:
    build: .
    image: claude-container:dev
    restart: "no"
    tty: true
    stdin_open: true
    environment:
      REMOTE_NAME: claude-container-dev
    volumes:
      - config:/home/claude/.claude
      - workspace:/workspace
      - ./managed-settings.json:/etc/claude-code/managed-settings.json:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  config:
  workspace:
