name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CLAUDE_CODE_CHANNEL: stable
  IMAGE: ghcr.io/${{ github.repository_owner }}/claude-container

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The newest version that the apt repository holds for both platforms.
      - id: version
        run: |
          repo="https://downloads.claude.ai/claude-code/apt/${CLAUDE_CODE_CHANNEL}/dists/${CLAUDE_CODE_CHANNEL}/main"
          for arch in amd64 arm64; do
            curl -fsSL "${repo}/binary-${arch}/Packages" | sed -n 's/^Version: //p' | sort -u > "${arch}.versions"
          done
          package="$(comm -12 amd64.versions arm64.versions | sort -V | tail -n 1)"
          if [ -z "${package}" ]; then
            echo "::error::the ${CLAUDE_CODE_CHANNEL} channel holds no version for both platforms"
            exit 1
          fi
          version="${package%-*}"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      # A scheduled run builds only a version the registry does not hold yet.
      - id: published
        run: |
          if [ "${{ github.event_name }}" = schedule ] &&
              docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint the scripts
        if: steps.published.outputs.skip == 'false'
        run: shellcheck --shell=sh src/entrypoint.sh src/setup.sh

      - uses: docker/setup-qemu-action@v4
        if: steps.published.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v4
        if: steps.published.outputs.skip == 'false'

      - uses: docker/login-action@v4
        if: steps.published.outputs.skip == 'false' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.published.outputs.skip == 'false'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - uses: docker/build-push-action@v7
        if: steps.published.outputs.skip == 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CLAUDE_CODE_CHANNEL=${{ env.CLAUDE_CODE_CHANNEL }}
            CLAUDE_CODE_VERSION=${{ steps.version.outputs.package }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
