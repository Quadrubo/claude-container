name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CLAUDE_CODE_CHANNEL: stable
  IMAGE: ghcr.io/${{ github.repository_owner }}/claude-container

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag push releases that tag. A scheduled run rebuilds the newest
      # release with the newest Claude Code version.
      - id: release
        run: |
          case "${{ github.event_name }}" in
            push)
              tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
              ;;
            schedule|workflow_dispatch)
              tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)"
              if [ -n "${tag}" ]; then
                git checkout --quiet "${tag}"
              fi
              ;;
            *)
              tag=""
              ;;
          esac
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The newest Claude Code version that the apt repository holds for both
      # platforms.
      - id: claude
        run: |
          repo="https://downloads.claude.ai/claude-code/apt/${CLAUDE_CODE_CHANNEL}/dists/${CLAUDE_CODE_CHANNEL}/main"
          for arch in amd64 arm64; do
            curl -fsSL "${repo}/binary-${arch}/Packages" | sed -n 's/^Version: //p' | sort -u > "${arch}.versions"
          done
          package="$(comm -12 amd64.versions arm64.versions | sort -V | tail -n 1)"
          if [ -z "${package}" ]; then
            echo "::error::the ${CLAUDE_CODE_CHANNEL} channel holds no version for both platforms"
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${package%-*}" >> "$GITHUB_OUTPUT"

      # A scheduled or manual run needs a release. A scheduled run builds only
      # a combination of versions that the registry does not hold yet.
      - id: skip
        run: |
          skip=false
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              if [ -z "${{ steps.release.outputs.version }}" ]; then
                skip=true
              fi
              ;;
          esac
          if [ "${{ github.event_name }}" = schedule ] && [ "${skip}" = false ] &&
              docker buildx imagetools inspect "${IMAGE}:${{ steps.release.outputs.version }}-${{ steps.claude.outputs.version }}" > /dev/null 2>&1; then
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Lint the scripts
        if: steps.skip.outputs.skip == 'false'
        run: shellcheck --shell=sh src/entrypoint.sh src/setup.sh

      - uses: docker/setup-qemu-action@v4
        if: steps.skip.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v4
        if: steps.skip.outputs.skip == 'false'

      - uses: docker/login-action@v4
        if: steps.skip.outputs.skip == 'false' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.skip.outputs.skip == 'false'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=main,enable=${{ github.event_name == 'push' && steps.release.outputs.version == '' }}
            type=raw,value=${{ steps.release.outputs.version }}-${{ steps.claude.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.version != '' }}

      - uses: docker/build-push-action@v7
        if: steps.skip.outputs.skip == 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CLAUDE_CODE_CHANNEL=${{ env.CLAUDE_CODE_CHANNEL }}
            CLAUDE_CODE_VERSION=${{ steps.claude.outputs.package }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
